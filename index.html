while(i<t.length){const ch=t[i];if(/[\u4e00-\u9fff]/.test(ch)){let m=null;for(let L=Math.min(6,t.length-i);L>0;L--){const s=t.substr(i,L);if(D.has(s)){m=s;break}}
if(m){const c=st[D.get(m).id];o+=`<span class="rw ${c?(c.i>=21?'k':'l'):'n'}" data-h="${m}">${m}</span>`;i+=m.length}else{o+=ch;i++}}
else{o+=ch=='\n'?'<br>':esc(ch);i++}}return o}
function vRead(){return `<div class=card><b>Читатель</b><p class=mu>Откройте свой файл (PDF, EPUB, TXT) или вставьте текст. Файл не покидает ваше устройство. Нажмите на слово, чтобы увидеть пиньинь и перевод. Сплошное подчёркивание — слово новое, пунктир — учите, без линии — выучено.</p><input type=file accept=".pdf,.epub,.txt" onchange="openFile(this.files[0])" style="width:100%"><textarea id=pt rows=3 placeholder="Или вставьте китайский текст"></textarea><button onclick="setRD('Текст',splitTxt($('#pt').value))">Читать вставленный текст</button></div>`+(RD.n?`<div class=row><button onclick="rp(-1)">←</button><span id=pn class=mu style="flex:1;text-align:center">${esc(RD.n)}: стр. ${RD.p+1} из ${RD.t}</span><button onclick="rp(1)">→</button></div><div class="card rd" id=rdtxt></div>`:'')}
document.addEventListener('click',e=>{const pop=$('#pop'),t=e.target.closest('.rw');
if(!t){if(!e.target.closest('#pop'))pop.style.display='none';return}
const w=words().find(x=>x.h==t.dataset.h);if(!w)return;
pop.innerHTML=`<b class=wh style="font-size:26px">${esc(w.h)}</b> <span class=py>${esc(w.py)}</span> <button class=sp onclick="say('${w.h}')">🔊</button><br>${esc(w.ru||w.en)} <span class=mu>· HSK ${w.lv}</span>`+(w.ex?`<div class=ex>${esc(w.ex)}<br><span class=mu>${esc(w.ep)}</span><br>${esc(w.er)}</div>`:'');pop.style.display='block'});
function vMore(){return vProg()+`<div class=card><b>Новых слов в день</b><div class=row><input id=lm type=number min=1 max=100 value=${S.lim}><button onclick="S.lim=Math.max(1,+$('#lm').value||10);save();alert('Сохранено')">Сохранить</button></div></div>
<div class=card><b>Добавить слова</b><p class=mu>Одно слово в строке: уровень|иероглиф|пиньинь|перевод|пример|пиньинь примера|перевод примера. Пример можно не указывать.</p><textarea id=im rows=6></textarea><button class=pri onclick=imp()>Добавить слова</button></div>
<div class=card><b>Перенос прогресса на другое устройство</b><p class=mu>Скопируйте текст ниже и вставьте его в поле на другом устройстве.</p><textarea id=ex rows=3 readonly onclick=this.select()>${esc(JSON.stringify(S))}</textarea><textarea id=bk rows=3 placeholder="Вставьте сюда копию"></textarea><button onclick=rst()>Восстановить</button></div>`}
function imp(){const a=parse($('#im').value);S.x=[...new Map([...S.x,...a].map(w=>[w.id,w])).values()];save();$('#im').value='';_W=null;alert('Добавлено слов: '+a.length)}
function rst(){try{const o=JSON.parse($('#bk').value);if(!o.p)throw 0;S=o;_W=null;save('*');build();alert('Прогресс восстановлен')}catch(e){alert('Не удалось прочитать копию')}}
function theme(){const t=TG.themeParams||{},r=document.documentElement.style,m={'--bg':t.secondary_bg_color||t.bg_color,'--card':t.bg_color,'--tx':t.text_color,'--mu':t.hint_color,'--ac':t.button_color,'--on':t.button_text_color,'--bd':t.hint_color&&t.hint_color+'44'};for(const k in m)if(m[k])r.setProperty(k,m[k]);try{TG.setHeaderColor('secondary_bg_color')}catch(e){}}
async function init(){
if(TG){TG.ready();TG.expand();theme();TG.onEvent('themeChanged',theme);
if(CS){const v=await cget(['m',...Array.from({length:NCH},(_,i)=>'c'+i)]);
if(!v)cloudOK=false;else try{if(Object.values(v).some(Boolean)){const p=P(),c={};
for(let i=0;i<NCH;i++)if(v['c'+i]){const o=JSON.parse(v['c'+i]);for(const id in o){const a=o[id];c[id]={e:a[0],i:a[1],r:a[2],d:a[3]*6e4}}}
p.c=c;if(v.m){const m=JSON.parse(v.m);S.lim=m.lim||S.lim;S.lv=m.lv||0;S.dir=m.dir||0;p.l=m.l||{}}}else save('*')}catch(e){cloudOK=false}}
P().n=(TG.initDataUnsafe.user||{}).first_name||P().n}
try{const r=await fetch('ru.txt?'+Date.now());if(r.ok)setRU(R0+'\n'+await r.text())}catch(e){}
try{const r=await fetch('grammar.txt?'+Date.now());if(r.ok)GR=(await r.text()).split('\n').map(l=>l.split('|')).filter(a=>a.length>=6).map(a=>({lv:a[0],p:a[1],t:a[2],ex:a[3],ep:a[4],er:a[5]}))}catch(e){}
build()}
init();
</script></body></html>
